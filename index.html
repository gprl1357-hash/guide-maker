<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가이드 메이커</title>
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
<style>
  :root { --c: #2563eb; --bd: #d4d8e0; --bg: #f5f6f8; --tx: #1f2328; --mut: #6b7280; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--tx); }
  header { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid var(--bd); }
  nav { display: flex; max-width: 960px; margin: 0 auto; }
  nav button { flex: 1; padding: 14px 4px; border: 0; background: none; font: inherit; color: var(--mut); border-bottom: 3px solid transparent; cursor: pointer; }
  nav button.on { color: var(--c); border-color: var(--c); font-weight: 600; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }
  section { display: none; } section.on { display: block; }
  h2 { margin: 0 0 16px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input[type=text], textarea { width: 100%; padding: 10px; border: 1px solid var(--bd); border-radius: 8px; font: inherit; background: #fff; }
  textarea { min-height: 80px; resize: vertical; }
  .btn { padding: 10px 18px; border: 1px solid var(--bd); border-radius: 8px; background: #fff; font: inherit; cursor: pointer; }
  .btn.pri { background: var(--c); border-color: var(--c); color: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 24px; }
  .row .sp { flex: 1; }
  .drop { border: 2px dashed var(--bd); border-radius: 12px; padding: 28px; text-align: center; color: var(--mut); background: #fff; cursor: pointer; }
  .drop b { color: var(--c); }
  body.dragging .drop, .card.dragover { border-color: var(--c); background: #eef4ff; }
  .card { background: #fff; border: 1px solid var(--bd); border-radius: 12px; padding: 16px; margin-top: 16px; }
  .card-h { display: flex; gap: 8px; align-items: center; }
  .card-h .no { font-weight: 700; color: var(--c); white-space: nowrap; }
  .card-h input { flex: 1; }
  .icon { border: 1px solid var(--bd); background: #fff; border-radius: 6px; padding: 6px 9px; cursor: pointer; font: inherit; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 12px 0 8px; }
  .tools input[type=color] { width: 36px; height: 32px; border: 1px solid var(--bd); border-radius: 6px; padding: 2px; background: #fff; }
  .stage { overflow-x: auto; border: 1px solid var(--bd); border-radius: 8px; line-height: 0; }
  .empty { border: 2px dashed var(--bd); border-radius: 8px; padding: 24px; text-align: center; color: var(--mut); margin: 12px 0; cursor: pointer; }
  .hint { color: var(--mut); font-size: 13px; }
  /* 완성 문서 */
  .doc { background: #fff; border: 1px solid var(--bd); border-radius: 12px; padding: 40px; }
  .gd h1 { margin: 0 0 8px; }
  .gd .meta { color: var(--mut); font-size: 14px; }
  .gd .purpose { margin: 20px 0; padding: 14px 16px; background: #f3f6fc; border-left: 4px solid var(--c); white-space: pre-wrap; }
  .gd .step { margin-top: 32px; break-inside: avoid; }
  .gd .step h3 { margin: 0 0 10px; }
  .gd .step img { max-width: 100%; border: 1px solid var(--bd); border-radius: 6px; }
  .gd .step p { white-space: pre-wrap; line-height: 1.6; }
  @media print {
    header, .row, section:not(#p3):not(#p4), #p4 > :not(.doc) { display: none !important; }
    body, main { background: #fff; padding: 0; }
    .doc { border: 0; padding: 0; }
  }
</style>
</head>
<body>
<header><nav id="nav">
  <button data-p="1" class="on">1. 제목</button>
  <button data-p="2">2. 작성</button>
  <button data-p="3">3. 검토</button>
  <button data-p="4">4. 완성</button>
</nav></header>
<main>
  <section id="p1" class="on">
    <h2>가이드 문서 제목 설정</h2>
    <label for="title">제목 *</label>
    <input type="text" id="title" placeholder="예) 사내 VPN 접속 방법">
    <label for="purpose">목적</label>
    <textarea id="purpose" placeholder="이 가이드로 무엇을 할 수 있는지 적어주세요."></textarea>
    <label for="author">작성자</label>
    <input type="text" id="author">
    <div class="row"><span class="sp"></span><button class="btn pri" data-go="2">다음 →</button></div>
  </section>

  <section id="p2">
    <h2>가이드 문서 작성</h2>
    <div class="drop" id="drop">
      이미지를 <b>끌어다 놓거나</b>, <b>Ctrl+V로 붙여넣거나</b>, <b>클릭해서 선택</b>하세요.<br>
      <span class="hint">여러 장을 한 번에 올리면 이미지마다 단계가 하나씩 만들어집니다.</span>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <div id="steps"></div>
    <div class="row">
      <button class="btn" id="addText">+ 이미지 없는 단계 추가</button>
      <span class="sp"></span>
      <button class="btn" data-go="1">← 이전</button>
      <button class="btn pri" data-go="3">검토 →</button>
    </div>
  </section>

  <section id="p3">
    <h2>완성된 가이드 문서 검토</h2>
    <div class="doc"></div>
    <div class="row"><span class="sp"></span><button class="btn" data-go="2">← 수정하기</button><button class="btn pri" data-go="4">완성 →</button></div>
  </section>

  <section id="p4">
    <h2>완성</h2>
    <div class="row" style="margin-top:0">
      <button class="btn pri" id="pdf">PDF로 저장 / 인쇄</button>
      <button class="btn" id="html">HTML 파일 다운로드</button>
      <span class="sp"></span>
      <button class="btn" data-go="2">← 수정하기</button>
    </div>
    <div class="doc" style="margin-top:16px"></div>
  </section>
</main>

<template id="tpl">
  <div class="card">
    <div class="card-h">
      <span class="no"></span>
      <input type="text" class="st-title" placeholder="단계 제목 (선택)">
      <button class="icon up" title="위로">↑</button>
      <button class="icon down" title="아래로">↓</button>
      <button class="icon del" title="단계 삭제">✕</button>
    </div>
    <div class="empty">이 단계에 이미지를 넣으려면 여기로 끌어놓거나 클릭하세요.</div>
    <div class="editor" hidden>
      <div class="tools">
        <button class="icon" data-t="rect">▭ 사각형</button>
        <button class="icon" data-t="ellipse">◯ 원</button>
        <button class="icon" data-t="arrow">➜ 화살표</button>
        <button class="icon" data-t="text">T 텍스트</button>
        <button class="icon" data-t="marker">① 번호</button>
        <button class="icon" data-t="blur">▦ 가리기</button>
        <input type="color" class="color" value="#e11d48" title="색상">
        <button class="icon" data-t="remove">선택 삭제</button>
        <button class="icon" data-t="replace">이미지 교체</button>
      </div>
      <div class="stage"><canvas></canvas></div>
      <div class="hint">도형을 끌어서 옮기고 모서리로 크기를 조절하세요. 텍스트는 더블클릭해서 수정합니다. Delete 키로 삭제.</div>
    </div>
    <label>설명</label>
    <textarea class="st-desc" placeholder="이 단계에서 해야 할 일을 적어주세요."></textarea>
  </div>
</template>

<script>
const $ = (s, el = document) => el.querySelector(s);
const steps = [];          // { card, canvas, scale }
let activeStep = null;     // 마지막으로 만진 단계 (붙여넣기·삭제 대상)

// ---------- 페이지 이동 ----------
function go(p) {
  if (p > 1 && !$('#title').value.trim()) { alert('제목을 입력해주세요.'); p = 1; $('#title').focus(); }
  if (p >= 3) $('#p' + p + ' .doc').innerHTML = buildDoc();
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === 'p' + p));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.p == p));
  scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-p]');
  if (t) go(+(t.dataset.go || t.dataset.p));
});

// ---------- 단계 관리 ----------
function addStep() {
  const card = $('#tpl').content.firstElementChild.cloneNode(true);
  const step = { card, canvas: null, scale: 1 };
  steps.push(step);
  $('#steps').append(card);
  card.addEventListener('pointerdown', () => activeStep = step);
  $('.del', card).onclick = () => {
    if (!confirm('이 단계를 삭제할까요?')) return;
    steps.splice(steps.indexOf(step), 1); card.remove(); renumber();
  };
  $('.up', card).onclick = () => move(step, -1);
  $('.down', card).onclick = () => move(step, 1);
  $('.empty', card).onclick = () => pickFiles(step);
  card.addEventListener('dragover', e => { e.preventDefault(); card.classList.add('dragover'); });
  card.addEventListener('dragleave', () => card.classList.remove('dragover'));
  card.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation(); card.classList.remove('dragover'); document.body.classList.remove('dragging');
    const files = images(e.dataTransfer.files);
    if (!files.length) return;
    if (step.canvas) addImages(files); else { setImage(step, files[0]); addImages(files.slice(1)); }
  });
  $('.tools', card).onclick = e => { const t = e.target.closest('[data-t]'); if (t) tool(step, t.dataset.t); };
  $('.color', card).oninput = e => {
    const o = step.canvas?.getActiveObject(); if (!o) return;
    paint(o, e.target.value); step.canvas.requestRenderAll();
  };
  renumber();
  activeStep = step;
  return step;
}
function move(step, d) {
  const i = steps.indexOf(step), j = i + d;
  if (j < 0 || j >= steps.length) return;
  [steps[i], steps[j]] = [steps[j], steps[i]];
  steps.forEach(s => $('#steps').append(s.card));
  renumber();
}
function renumber() { steps.forEach((s, i) => $('.no', s.card).textContent = `${i + 1}단계`); }

// ---------- 파일 업로드 (드롭·붙여넣기·선택) ----------
const images = list => [...list].filter(f => f.type.startsWith('image/'));
let pickTarget = null;
function pickFiles(step) { pickTarget = step; $('#file').value = ''; $('#file').click(); }
$('#drop').onclick = () => pickFiles(null);
$('#file').onchange = e => {
  const files = images(e.target.files);
  if (!files.length) return;
  if (pickTarget) { setImage(pickTarget, files.shift()); }
  addImages(files);
};
function addImages(files) {
  if (!files.length) return;
  if (!$('#p2').classList.contains('on')) go(2);
  let last;
  files.forEach(f => setImage(last = addStep(), f));
  last.card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
document.addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('dragging');
  const files = images(e.dataTransfer.files);
  if (files.length) addImages(files); else if (e.dataTransfer.files.length) alert('이미지 파일만 넣을 수 있습니다.');
});
document.addEventListener('paste', e => {
  const files = images([...e.clipboardData.items].filter(i => i.kind === 'file').map(i => i.getAsFile()));
  if (!files.length) return;          // 텍스트 붙여넣기는 그대로 둠
  e.preventDefault();
  if (activeStep && !activeStep.canvas && steps.includes(activeStep)) setImage(activeStep, files.shift());
  addImages(files);
});
$('#addText').onclick = () => addStep().card.scrollIntoView({ behavior: 'smooth', block: 'center' });

// ---------- 이미지 편집기 ----------
function setImage(step, file) {
  const url = URL.createObjectURL(file);
  fabric.Image.fromURL(url, img => {
    URL.revokeObjectURL(url);
    const maxW = Math.min(img.width, $('#steps').clientWidth - 34 || 860);
    step.scale = maxW / img.width;
    if (step.canvas) step.canvas.dispose(), $('.stage', step.card).innerHTML = '<canvas></canvas>';
    const c = step.canvas = new fabric.Canvas($('canvas', step.card), { width: maxW, height: img.height * step.scale, preserveObjectStacking: true });
    img.set({ scaleX: step.scale, scaleY: step.scale });
    c.setBackgroundImage(img, c.renderAll.bind(c));
    c.on('mouse:down', () => activeStep = step);
    $('.empty', step.card).hidden = true;
    $('.editor', step.card).hidden = false;
  });
}
function paint(o, color) {
  if (o.type === 'group') return o.getObjects().forEach(x => x.type === 'circle' && x.set('fill', color));
  if (o.type === 'i-text') return o.set('fill', color);
  if (o.isBlur) return o.set('fill', color);
  o.set('stroke', color);
}
function tool(step, t) {
  const c = step.canvas;
  if (t === 'replace') return pickFiles(step);
  if (t === 'remove') { c.getActiveObjects().forEach(o => c.remove(o)); c.discardActiveObject(); return c.requestRenderAll(); }
  const color = $('.color', step.card).value;
  const k = c.getObjects().length % 6 * 24 - 60;   // 새 도형이 겹치지 않게 조금씩 비켜서 배치
  const cx = c.width / 2 + k, cy = c.height / 2 + k;
  const base = { left: cx, top: cy, originX: 'center', originY: 'center', stroke: color, strokeWidth: 3, fill: 'transparent', strokeUniform: true };
  let o;
  if (t === 'rect') o = new fabric.Rect({ ...base, width: 160, height: 80, rx: 4, ry: 4 });
  if (t === 'ellipse') o = new fabric.Ellipse({ ...base, rx: 70, ry: 40 });
  if (t === 'arrow') o = new fabric.Path('M 0 0 L 120 0 M 104 -12 L 120 0 L 104 12', { ...base, strokeWidth: 4, strokeLineCap: 'round', strokeLineJoin: 'round' });
  if (t === 'blur') o = new fabric.Rect({ ...base, width: 140, height: 40, stroke: null, fill: '#111827', isBlur: true });
  if (t === 'text') o = new fabric.IText('텍스트 입력', { ...base, stroke: null, fill: color, fontSize: 22, fontWeight: 'bold', fontFamily: getComputedStyle(document.body).fontFamily, backgroundColor: 'rgba(255,255,255,.85)', padding: 4 });
  if (t === 'marker') {
    const n = c.getObjects().filter(x => x.isMarker).length + 1;
    o = new fabric.Group([
      new fabric.Circle({ radius: 16, fill: color, originX: 'center', originY: 'center', stroke: '#fff', strokeWidth: 2 }),
      new fabric.Text(String(n), { fontSize: 18, fontWeight: 'bold', fill: '#fff', originX: 'center', originY: 'center', fontFamily: 'sans-serif' }),
    ], { left: cx, top: cy, originX: 'center', originY: 'center', isMarker: true });
  }
  c.add(o).setActiveObject(o);
  if (t === 'text') { o.enterEditing(); o.selectAll(); }
  c.requestRenderAll();
}
document.addEventListener('keydown', e => {
  if (!['Delete', 'Backspace'].includes(e.key) || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const c = activeStep?.canvas, o = c?.getActiveObject();
  if (!o || o.isEditing) return;
  e.preventDefault();
  c.getActiveObjects().forEach(x => c.remove(x)); c.discardActiveObject(); c.requestRenderAll();
});

// ---------- 문서 생성 ----------
const esc = s => s.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
function buildDoc() {
  const title = $('#title').value.trim(), purpose = $('#purpose').value.trim(), author = $('#author').value.trim();
  const meta = [author && `작성자: ${esc(author)}`, `작성일: ${new Date().toLocaleDateString('ko-KR')}`].filter(Boolean).join(' · ');
  const body = steps.map((s, i) => {
    const h = $('.st-title', s.card).value.trim(), d = $('.st-desc', s.card).value.trim();
    if (s.canvas) s.canvas.discardActiveObject().renderAll();
    const img = s.canvas ? `<img alt="${i + 1}단계 이미지" src="${s.canvas.toDataURL({ format: 'png', multiplier: 1 / s.scale })}">` : '';
    return `<div class="step"><h3>${i + 1}. ${esc(h || `${i + 1}단계`)}</h3>${img}${d ? `<p>${esc(d)}</p>` : ''}</div>`;
  }).join('');
  return `<article class="gd"><h1>${esc(title)}</h1><div class="meta">${meta}</div>${purpose ? `<div class="purpose"><b>목적</b><br>${esc(purpose)}</div>` : ''}${body || '<p class="meta">작성된 단계가 없습니다.</p>'}</article>`;
}
$('#pdf').onclick = () => print();
$('#html').onclick = () => {
  const css = [...document.styleSheets[0].cssRules].map(r => r.cssText).filter(t => /^(:root|\.gd|\*)/.test(t)).join('\n');
  const html = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc($('#title').value.trim())}</title><style>${css}body{font-family:system-ui,sans-serif;max-width:860px;margin:40px auto;padding:0 16px;color:#1f2328}</style></head><body>${buildDoc()}</body></html>`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  a.download = ($('#title').value.trim() || 'guide').replace(/[\\/:*?"<>|]/g, '_') + '.html';
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
// 새로고침·창 닫기로 작업이 날아가지 않게 경고 (저장 기능 없음)
addEventListener('beforeunload', e => { if (steps.length || $('#title').value) e.preventDefault(); });
</script>
</body>
</html>
